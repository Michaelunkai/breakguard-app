[package]
name = "breakguard"
version = "0.2.0"
edition = "2021"
description = "Break timer, timed sleep, night mode and screen controls for Windows. Never closes your programs."

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts"] }

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Power",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Threading",
  "Win32_Devices_Display",
]

[profile.release]
opt-level = 2
lto = false
strip = true

[patch.crates-io]
webbrowser = { path = "stub-webbrowser" }
